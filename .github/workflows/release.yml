name: release

# Attaches Rust binaries to a published GitHub release. Run it by hand with a tag to add
# them to a release made before this workflow existed.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # gh release upload
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # No toolchain action: the runners ship rustup, which installs the version
      # rust-toolchain.toml pins on the first cargo call.
      - name: Build
        run: cargo build --release --locked --manifest-path rust/Cargo.toml

      - name: Package
        run: |
          name="integrity-check-$TAG-$TARGET"
          mkdir "$name"
          cp rust/target/release/integrity-check LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" >"$name.tar.gz.sha256"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" integrity-check-*.tar.gz integrity-check-*.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
