name: ci

on:
  push:
    branches: [ "**" ]
  pull_request:


permissions:
  contents: read

jobs:
  test:
    # ext4 accepts filenames APFS refuses outright, so Linux is the only place test.sh's
    # non-UTF-8 name case actually runs; it skips itself elsewhere. macOS covers BSD
    # stat/awk/sed, which differ from the GNU ones enough to have broken this before.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # No toolchain action: the runners ship rustup, which installs the version
      # rust-toolchain.toml pins on the first cargo call.
      - name: Build the rust implementation
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Test all three
        run: ./test.sh

      - name: Differential test on random trees
        run: ./difftest.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2
