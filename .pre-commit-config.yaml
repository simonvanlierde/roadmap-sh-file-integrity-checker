# Run with: prek run --all-files   (install the git hook with: prek install)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
        language: system
        files: ^rust/
        pass_filenames: false

      - id: rustfmt
        name: cargo fmt
        entry: cargo fmt --manifest-path rust/Cargo.toml --check
        language: system
        files: ^rust/
        pass_filenames: false
